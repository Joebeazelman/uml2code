# dump/manifest.ini -- reference template set.
#
# Renders every model element with all its dictionary keys and their
# values. Developers can use this output to see what data is
# available when writing their own templates.
#
# The class dump also includes a filter reference section showing
# every registered casing filter applied to the class name.

[set]
name      = dump
language  = Text
extension = .txt

[emit]
class         = class_dump.tpl
relation      = relation_dump.tpl
state_machine = state_machine_dump.tpl

[context]
class         = name, visibility, attributes, operations
relation      = kind, source, target, source_role, target_role, multiplicity
state_machine = name, initial, states, transitions
