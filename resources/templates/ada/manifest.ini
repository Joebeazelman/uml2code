# ada/manifest.ini -- template set descriptor

[set]
name      = ada
language  = Ada
extension = .ads

[emit]
class         = class.tpl
relation      = relation.tpl
state_machine = state_machine.tpl

[context]
class         = name, visibility, attributes, operations
relation      = kind, source, target, source_role, target_role, multiplicity
state_machine = name, states, transitions, initial
